[package]
name = "wu-wei"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
eframe = "0.36.1"
egui = "0.36.1"
egui_extras = { version = "0.36.1", features = ["datepicker"] }
form_urlencoded = "1.2.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
jiff = "0.2.35"
rfd = "0.17.2"
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
ureq = { version = "3.4.0", features = ["json"] }
uuid = { version = "1.24.1", features = ["v4"] }
webbrowser = "1.0.5"
